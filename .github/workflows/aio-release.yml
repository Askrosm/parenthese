name: AIO test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version de test (sans v)
        required: true
        default: 1.1.0-immich.2

permissions:
  contents: read

concurrency:
  group: aio-test-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate version and image name
        id: image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-immich\.[0-9]+$ ]]
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$OWNER/parenthese-aio" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AIO
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          cache-from: type=gha,scope=aio-test
          cache-to: type=gha,mode=max,scope=aio-test
      - name: Test published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          SMOKE_WAIT_SECONDS: 180
        run: |
          set -euo pipefail
          docker run -d --name aio-test -p 8080:80 -v aio-test-data:/data "$IMAGE"
          bash tools/docker-smoke.sh http://localhost:8080
          docker restart aio-test
          bash tools/docker-smoke.sh http://localhost:8080
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Version de test : souvenirs photo et vidéo depuis Immich.

          Galerie intégrée au style de Parenthèse, aperçu agrandi avant sélection, recherche par contexte et filtre par visage combinables. La recherche intelligente doit être activée dans Immich ; le filtre visage utilise la permission person.read.

          Image AIO : \`$IMAGE\` (linux/amd64 et linux/arm64).

          \`docker pull $IMAGE\`

          Utiliser cette image à la place de l'image AIO actuelle et conserver le montage existant vers /data. Pour un test indépendant, utiliser un nouveau dossier /data et un autre port.

          Immich : conserver IMMICH_ALLOWED_API_URLS et la connexion de l'arbre. La clé doit autoriser asset.read, asset.view et asset.download. Import réservé aux administrateurs, photo 5 Mo et vidéo 20 Mo maximum.

          Test automatique : démarrage AMD64, création de compte et d'arbre, API, puis redémarrage avec le même volume. Le parcours Immich réel et le démarrage ARM64 restent à tester.

          Commit : $GITHUB_SHA
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "AIO $VERSION — souvenirs Immich" --notes-file release-notes.md
      - name: Logs on failure
        if: failure()
        run: docker logs aio-test || true
      - name: Cleanup test container
        if: always()
        run: |
          docker rm -f aio-test || true
          docker volume rm aio-test-data || true
